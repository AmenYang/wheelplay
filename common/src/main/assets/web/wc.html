<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f12">
<title>WheelPlay · 低延迟</title>
<link rel="stylesheet" href="/wc.css">
<script type="module" src="/wc.js"></script>
</head>
<body>
<section id="connect" class="panel">
  <h1>WheelPlay · 低延迟模式</h1>
  <p class="hint">WebSocket + WebCodecs 直通：没有 RTP、没有 DTLS，一路 TCP 字节流直接喂给浏览器解码器。</p>
  <form id="connect-form">
    <label for="code">配对码</label>
    <input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" placeholder="6 位数字" required>
    <button type="submit" id="connect-button">连接</button>
  </form>
  <p id="message" role="alert"></p>
  <p class="hint small">需要 Chrome / Edge 94+ 等支持 WebCodecs 的浏览器。想在 Wi-Fi 不稳的场景抗丢包，请回<a href="/">兼容模式（WebRTC / 图片）</a>。</p>
</section>
<section id="stage" hidden>
  <canvas id="video" width="0" height="0" aria-label="CarPlay 画面"></canvas>
  <div id="hud">
    <span id="status">等待画面…</span>
    <button id="fullscreen" type="button">全屏</button>
  </div>
</section>
</body>
</html>
